version: "3"

# 本编排不再创建 mysql/redis 容器, 复用宿主机上已有的 PostgreSQL(5432) 与 Redis(6379)
# server 容器通过 extra_hosts 的 host.docker.internal:host-gateway 访问宿主机端口
# 连接信息见 server/config.docker.yaml (db-type: pgsql / use-redis: true)
# 注意: web 的 nginx 将 /api 反代到固定 IP 177.7.0.12 的 gva-server(见 web/.docker-compose/nginx/conf.d/my.conf),
#       因此保留固定子网, 请勿修改 gva-server 的 IP
networks:
  network:
    ipam:
      driver: default
      config:
        - subnet: '177.7.0.0/16'

services:
  web:
    build:
      context: ../../web
      dockerfile: ./Dockerfile
    container_name: gva-web
    restart: always
    ports:
      - '8080:8080'
    depends_on:
      - server
    command: [ 'nginx-debug', '-g', 'daemon off;' ]
    networks:
      network:
        ipv4_address: 177.7.0.11

  server:
    build:
      context: ../../server
      dockerfile: ./Dockerfile
    container_name: gva-server
    restart: always
    ports:
      - '8888:8888'
    extra_hosts:
      - 'host.docker.internal:host-gateway' # 指向宿主机, 复用宿主机的 PostgreSQL 与 Redis
    volumes:
      - ./config.docker.yaml:/go/src/github.com/flipped-aurora/gin-vue-admin/server/config.docker.yaml # 运行配置挂载, 初始化后凭据持久化到宿主机
    networks:
      network:
        ipv4_address: 177.7.0.12
