# RuleGo Server 配置（gin-vue-admin 内嵌模式）
# 复制自 server/rulego/server/config.conf（官方 v0.37.2 模板），按 aiDoc/rulego/02-实施计划.md §2.2 做了以下修改：
#   1) require_auth = true        —— 安全基线：默认 false 时匿名请求以默认 admin 身份放行，
#                                    且 M3 的 bridge.WithoutLocalAuth() 硬性要求其为 true，任何阶段不得回退；
#   2) base_path = /rulego        —— 与胶水层挂载前缀（plugin/rulego 的 prefix）一致；
#   3) data/skill/log/node_pool   —— 数据统一收敛到 ./resource/rulego/，随 GVA 部署卷持久化；
#   4) allow_cors = false         —— GVA 前端同源访问（dev 走 vite 代理），无需跨域。
# 内嵌模式下 server=:9090 不会监听（流量全部经 GVA :8888 的 /rulego/** 转发），仅作配置完整性保留。

# =============================================================================
# General
# =============================================================================

data_dir = ./resource/rulego/data

skill_path = ./resource/rulego/data/skills

server = :9090

default_username = admin

base_path = /rulego

# =============================================================================
# Security
# =============================================================================

cmd_mode = allow

cmd_white_list = cp,scp,mvn,npm,yarn,git,make,cmake,docker,kubectl,helm,ansible,puppet,pytest,python,python3,pip,go,java,dotnet,gcc,g++,ctest

cmd_deny_list =

cmd_deny_args =

file_path_white_list = /tmp

load_lua_libs = true

# =============================================================================
# Authentication
# =============================================================================
# require_auth 必须为 true（见文件头说明 1）。M3 起胶水层注入 GVA JWT/Casbin 桥接并
# 关闭本地登录端点，以下本地账号与 JWT 配置仅在不接胶水层独立运行 rulego-server 时生效。

require_auth = true

#jwt_secret_key = ${JWT_SECRET_KEY:-r6G7qZ8xk9P0y1Q2w3E4r5T6y7U8i9O0pL7z8x9CvBnM3k2l1}

#jwt_expire_time = 43200000

#jwt_issuer = rulego.cc

#secret_key =

# =============================================================================
# Logging
# =============================================================================

debug = true

max_node_log_size = 40

log_file = ./resource/rulego/data/logs/rulego.log

#log_level = info

#log_max_size = 100

#log_max_backups = 30

#log_max_age = 7

# =============================================================================
# Runtime
# =============================================================================

resource_mapping = /editor/=./editor,/images/=./editor/images

node_pool_file = ./resource/rulego/node_pool.json

run_log_mode = summary

#run_log_store_type = bbolt

#run_log_retention_count = 500

#run_log_retention_days = 7

script_max_execution_time = 5000

#marketplace_base_url =

share_http_server = false

allow_cors = false

read_timeout = 30

write_timeout = 300

max_body_size = 10

#endpoint_enabled = true

#event_bus_chain_id =

#category_folder_enabled = false

# =============================================================================
# AI Tool Security
# Requires with_ai or with_all build tag. Ignored otherwise.
# =============================================================================

[ai_security]
enable = false

mode = deny

deny_tools = bash,write,edit

#allow_tools = read,plan,skill

#denied_types =

#cmd_deny_extra = curl,wget

deny_paths =

#allow_paths = /tmp

# =============================================================================
# MCP Server
# =============================================================================

[mcp]
enable = true

[mcp.groups]
manager = preview_rule_chain,save_rule_chain,list_rule_chains,get_rule_chain,delete_rule_chain,operate_rule_chain,execute_rule_chain,list_components,get_component_doc

# =============================================================================
# Pprof (Performance Profiling)
# =============================================================================

[pprof]
enable = false

addr = 0.0.0.0:6060

# =============================================================================
# Global Custom Configuration
# =============================================================================

[global]
data_dir = ./resource/rulego/data

#sqlDriver = mysql
#sqlDsn = root:root@tcp(127.0.0.1:3306)/test

#llm_url = ${LLM_URL:-https://open.bigmodel.cn/api/coding/paas/v4}
#llm_api_key = ${LLM_API_KEY}
#llm_model = ${LLM_MODEL:-GLM-5}

# =============================================================================
# Users
# Format: username = password[,apiKey]
# M3 集成后本地账号体系整体关闭（/login、/users* 端点 404），此段仅在不接胶水层
# 独立运行 rulego-server 时生效；如启用，务必修改默认弱口令。
# =============================================================================

[users]
admin = admin,2af255ea5618467d914c67a8beeca31d
